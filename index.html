<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J2ME Game Launcher</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://kaios.tri1.workers.dev/?url=https://joe-x5.github.io/web/traffic/web2tg.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --surface: #151d31;
      --surface-hover: #202c45;
      --text: #f4f6ff;
      --muted: #9ba8c2;
      --primary: #7c5cff;
      --primary-soft: #2a2250;
      --border: #28344c;
      --focus: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #1b2440 0, transparent 55%),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .main-content {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #b8aaff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(21 29 49 / 88%);
      box-shadow: 0 12px 32px rgb(0 0 0 / 18%);
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search-box {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px 10px 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #0e1527;
      color: var(--text);
      font: inherit;
    }

    #search-box::placeholder { color: #77839d; }

    #search-box:focus,
    #file-list li:focus-visible {
      border-color: var(--primary);
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .game-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    #file-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #file-list li {
      position: relative;
      display: flex;
      min-height: 76px;
      align-items: center;
      gap: 13px;
      padding: 14px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(145deg, var(--surface), #11182a);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    #file-list li:hover {
      transform: translateY(-2px);
      border-color: #6652c8;
      background: var(--surface-hover);
    }

    #file-list li.selected {
      border-color: var(--focus);
      outline: 2px solid var(--focus);
      outline-offset: 1px;
      background: var(--primary-soft);
    }

    .game-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 12px;
      background: linear-gradient(145deg, #8c75ff, #5037c7);
      color: white;
      font-size: 1.2rem;
    }

    .game-name {
      min-width: 0;
      font-weight: 650;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 28px 16px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    .softkey-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      height: 30px;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--border);
      background: rgb(11 16 32 / 94%);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }

    .softkey-center { color: var(--focus); }

    .modal {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgb(0 0 0 / 72%);
    }

    .modal-content {
      width: min(100%, 380px);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      text-align: center;
      overflow-wrap: anywhere;
      box-shadow: 0 24px 80px rgb(0 0 0 / 40%);
    }

    @media (max-width: 520px) {
      .main-content {
        width: min(100% - 22px, 1000px);
        padding-top: 24px;
      }

      .toolbar { padding: 9px; }
      #file-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 240px), (max-height: 240px) {
      body { font-size: 12px; }
      .main-content { width: calc(100% - 12px); padding-top: 8px; }
      .header { margin-bottom: 10px; }
      .toolbar { gap: 6px; margin-bottom: 8px; padding: 6px; }
      #search-box { min-height: 34px; }
      #file-list { gap: 5px; }
      #file-list li { min-height: 48px; padding: 7px; }
      .game-icon { width: 30px; height: 30px; flex-basis: 30px; }
    }
  </style>
</head>

<body>
  <main class="main-content">
    <header class="header">
      <p class="eyebrow">Classic mobile games</p>
      <h1>J2ME Launcher</h1>
      <p class="subtitle">Choose a game to start playing</p>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="search-box"
          type="search"
          placeholder="Search games..."
          autocomplete="off"
          aria-label="Search games"
        >
      </div>
      <span id="game-count" class="game-count" aria-live="polite"></span>
    </div>

    <ul id="file-list" aria-label="Games"></ul>
  </main>

  <div id="extraction-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <p id="modal-message">Loading...</p>
    </div>
  </div>

  <div class="softkey-bar">
    <span id="softkey-left"></span>
    <span id="softkey-center" class="softkey-center"></span>
    <span id="softkey-right">Exit</span>
  </div>

  <script>
    var allFiles = [];
    var filteredFiles = [];
    var listIndex = -1;
    var currentFocus = 'search-box';

    function isCloudPhone() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('iscloudfone') === 'true') return true;
      return (navigator.userAgent || '').toLowerCase().includes('cloudphone');
    }

    window.addEventListener('load', function () {
      fetchFileList();

      if (!isCloudPhone()) {
        window.addEventListener('keydown', handleKeyDown);
      } else {
        document.querySelector('.softkey-bar').style.display = 'none';
      }

      document.getElementById('search-box').addEventListener('input', applySearch);
      updateSelection();
    });

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        document.getElementById('extraction-modal').style.display = 'none';
        document.getElementById('search-box').value = '';
        applySearch();
      }
    });

    function fetchFileList() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'list.json', true);

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          allFiles = xhr.responseText
            .split(/\r?\n/)
            .map(function (line) { return line.trim(); })
            .filter(Boolean)
            .map(function (path) {
              var filename = path.substring(path.lastIndexOf('/') + 1);
              return {
                path: path,
                name: filename.replace(/\.jar$/i, '')
              };
            });

          applySearch();
        } else {
          showListMessage('Could not load list.json (HTTP ' + xhr.status + ').');
        }
      };

      xhr.onerror = function () {
        showListMessage('Network error while loading list.json.');
      };

      xhr.send();
    }

    function applySearch() {
      var term = document.getElementById('search-box').value.trim().toLowerCase();

      filteredFiles = allFiles.filter(function (file) {
        return file.name.toLowerCase().includes(term);
      });

      renderList();
    }

    function renderList() {
      var list = document.getElementById('file-list');
      list.innerHTML = '';

      document.getElementById('game-count').textContent =
        filteredFiles.length + (filteredFiles.length === 1 ? ' game' : ' games');

      if (!filteredFiles.length) {
        showListMessage(allFiles.length ? 'No games match your search.' : 'No games available.');
        listIndex = -1;
        updateSelection();
        return;
      }

      filteredFiles.forEach(function (file) {
        var item = document.createElement('li');
        item.tabIndex = 0;

        var icon = document.createElement('span');
        icon.className = 'game-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '▶';

        var name = document.createElement('span');
        name.className = 'game-name';
        name.textContent = file.name;

        item.appendChild(icon);
        item.appendChild(name);
        item.addEventListener('click', function () {
          handleFileClick(file.path);
        });
        item.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') handleFileClick(file.path);
        });

        list.appendChild(item);
      });

      listIndex = -1;
      updateSelection();
    }

    function showListMessage(message) {
      var list = document.getElementById('file-list');
      list.innerHTML = '';

      var item = document.createElement('li');
      item.className = 'empty-state';
      item.textContent = message;
      list.appendChild(item);

      document.getElementById('game-count').textContent = '';
    }

    function handleFileClick(filePath) {
      showExtractionModal('Preparing game...');
      extractMidletClassName(filePath, function (error, midletName) {
        if (error) {
          showExtractionModal('Error: ' + error.message);
          return;
        }

        document.getElementById('extraction-modal').style.display = 'none';

        var url = 'main.html?jarlink=' + encodeURIComponent(filePath) +
          '&midlet=' + encodeURIComponent(midletName);
        window.location.href = url;
      });
    }

    function handleKeyDown(event) {
      var keys = ['ArrowUp', 'ArrowDown', 'Enter', 'Backspace'];
      if (keys.includes(event.key)) event.preventDefault();

      if (currentFocus === 'modal') {
        if (event.key === 'Enter' || event.key === 'Backspace') closeExtractionModal();
        return;
      }

      var items = document.getElementById('file-list').children;

      switch (event.key) {
        case 'ArrowDown':
          if (currentFocus !== 'list' && filteredFiles.length) {
            currentFocus = 'list';
            listIndex = 0;
          } else if (currentFocus === 'list' && listIndex < items.length - 1) {
            listIndex++;
          }
          break;

        case 'ArrowUp':
          if (currentFocus === 'list' && listIndex > 0) {
            listIndex--;
          } else if (currentFocus === 'list') {
            currentFocus = 'search-box';
            listIndex = -1;
          }
          break;

        case 'Enter':
          if (currentFocus === 'list' && listIndex >= 0) {
            items[listIndex] && items[listIndex].click();
          }
          break;

        case 'Backspace':
          window.close();
          break;
      }

      updateSelection();
    }

    function updateSelection() {
      document.querySelectorAll('.selected').forEach(function (element) {
        element.classList.remove('selected');
      });

      if (isCloudPhone()) return;

      if (currentFocus === 'list') {
        var items = document.getElementById('file-list').children;
        if (items[listIndex]) {
          items[listIndex].classList.add('selected');
          items[listIndex].scrollIntoView({ block: 'nearest' });
        }
      } else {
        var search = document.getElementById('search-box');
        search.classList.add('selected');
        search.focus();
      }

      document.getElementById('softkey-center').textContent =
        currentFocus === 'list' ? 'Select' : '';
    }

    function showExtractionModal(message) {
      currentFocus = 'modal';
      document.getElementById('modal-message').textContent = message;
      document.getElementById('extraction-modal').style.display = 'flex';
      document.getElementById('softkey-center').textContent = 'Close';
    }

    function closeExtractionModal() {
      document.getElementById('extraction-modal').style.display = 'none';
      currentFocus = 'search-box';
      updateSelection();
    }

    function extractMidletClassName(jarUrl, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', jarUrl, true);
      xhr.responseType = 'arraybuffer';

      xhr.onload = function () {
        if (xhr.status < 200 || xhr.status >= 300) {
          callback(new Error('Download failed (HTTP ' + xhr.status + ').'));
          return;
        }

        JSZip.loadAsync(xhr.response)
          .then(function (zip) {
            var manifest = zip.file('META-INF/MANIFEST.MF');
            if (!manifest) throw new Error('MANIFEST.MF not found.');
            return manifest.async('string');
          })
          .then(function (content) {
            var line = content.split(/\r?\n/).find(function (entry) {
              return /^MIDlet-\d+:/i.test(entry);
            });

            if (!line) throw new Error('MIDlet entry not found.');

            var parts = line.substring(line.indexOf(':') + 1).split(',');
            if (parts.length < 3) throw new Error('Malformed MIDlet entry.');

            callback(null, parts[parts.length - 1].trim());
          })
          .catch(function (error) {
            callback(error);
          });
      };

      xhr.onerror = function () {
        callback(new Error('Network error while downloading the game.'));
      };

      xhr.send();
    }
  </script>
</body>
</html>
