<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>J2ME Game Launcher</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg: #101820;
      --surface: #1d2b36;
      --text: #f4f7fa;
      --primary: #00bfa6;
      --hover: #315b78;
      --focus: #ffc857;
      --border: #40515e;
      --disabled: #58636b;
      --softkey-bg: #17232c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px Arial, sans-serif;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      padding-bottom: 36px;
    }

    h1 {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 1.15em;
      text-align: center;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      padding: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    label {
      font-size: 0.9em;
      font-weight: bold;
    }

    select,
    button,
    input {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    select,
    button {
      padding: 4px 6px;
    }

    #sort-order-btn {
      min-width: 30px;
      font-weight: bold;
    }

    #search-box {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px;
    }

    button,
    select,
    input,
    #file-list li {
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    button:hover,
    select:hover,
    #file-list li:hover {
      background: var(--hover);
      color: var(--text);
    }

    button:focus,
    select:focus,
    input:focus,
    #file-list li:focus,
    .selected {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
      border-color: var(--focus);
    }

    #file-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #file-list li {
      margin-bottom: 4px;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    #file-list li.selected {
      background: var(--primary);
      color: #071613;
      font-weight: bold;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      margin: 2px 0 6px;
      font-size: 0.9em;
      font-weight: bold;
    }

    .pagination button {
      background: var(--primary);
      color: #071613;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: var(--disabled);
      color: #ddd;
      cursor: not-allowed;
    }

    .softkey-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 30px;
      padding: 0 10px;
      background: var(--softkey-bg);
      font-size: 0.9em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .softkey-center {
      color: var(--focus);
    }

    .modal {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgb(0 0 0 / 75%);
    }

    .modal-content {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 240px), (max-height: 240px) {
      body {
        font-size: 12px;
      }

      .main-content {
        padding: 4px;
        padding-bottom: 32px;
      }

      h1 {
        margin-bottom: 4px;
        font-size: 1em;
      }

      .controls {
        gap: 3px;
        padding: 3px;
      }

      .control-group {
        gap: 2px;
      }

      label {
        font-size: 0.8em;
      }

      select,
      button,
      input {
        min-height: 26px;
        padding: 3px;
      }

      #file-list li {
        padding: 7px 6px;
      }

      .softkey-bar {
        height: 26px;
        padding: 0 6px;
      }
    }
  </style>
</head>

<body>
  <main class="main-content">
    <h1>J2ME Launcher</h1>

    <div class="controls">
      <div class="control-group">
        <label for="sort-by">Sort:</label>
        <select id="sort-by" aria-label="Sort files"></select>
        <button id="sort-order-btn" type="button" aria-label="Change sort order">↑</button>
      </div>

      <div class="control-group">
        <label for="items-per-page">Show:</label>
        <select id="items-per-page" aria-label="Items per page"></select>
      </div>
    </div>

    <input id="search-box" type="search" placeholder="Search games..." autocomplete="off">

    <div class="pagination">
      <button id="prev-page-btn" type="button">&lt; Prev</button>
      <span id="page-info" aria-live="polite"></span>
      <button id="next-page-btn" type="button">Next &gt;</button>
    </div>

    <ul id="file-list"></ul>
  </main>

  <div id="extraction-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <p id="modal-message">Loading...</p>
    </div>
  </div>

  <div class="softkey-bar">
    <span id="softkey-left"></span>
    <span id="softkey-center" class="softkey-center"></span>
    <span id="softkey-right">Exit</span>
  </div>

  <script>
    var allFiles = [];
    var filteredFiles = [];
    var currentPage = 1;
    var itemsPerPage = 10;
    var sortCriteria = 'none';
    var sortOrder = 'asc';
    var listIndex = -1;
    var currentFocus = 'search-box';

    var focusableControls = [
      'search-box',
      'sort-by',
      'sort-order-btn',
      'items-per-page'
    ];

    function isCloudPhone() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('iscloudfone') === 'true') return true;
      return (navigator.userAgent || '').toLowerCase().includes('cloudphone');
    }

    window.addEventListener('load', function () {
      setupControls();
      fetchFileList();

      if (!isCloudPhone()) {
        window.addEventListener('keydown', handleKeyDown);
      } else {
        document.querySelector('.softkey-bar').style.display = 'none';
      }

      updateSelection();
    });

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        document.getElementById('extraction-modal').style.display = 'none';
        document.getElementById('search-box').value = '';
        applyFiltersAndRender();
      }
    });

    // Asynchronous XHR: list.json contains one JAR path per line.
    function fetchFileList() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'list.json', true);

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          allFiles = xhr.responseText
            .split(/\r?\n/)
            .map(function (line) { return line.trim(); })
            .filter(Boolean)
            .map(function (path) {
              var filename = path.substring(path.lastIndexOf('/') + 1);
              return {
                path: path,
                name: filename.replace(/\.jar$/i, ''),
                type: filename.includes('.')
                  ? filename.substring(filename.lastIndexOf('.') + 1)
                  : ''
              };
            });

          applyFiltersAndRender();
        } else {
          showListMessage('Could not load list.json (HTTP ' + xhr.status + ').');
        }
      };

      xhr.onerror = function () {
        showListMessage('Network error while loading list.json.');
      };

      xhr.send();
    }

    function setupControls() {
      var sortBy = document.getElementById('sort-by');
      var pageSize = document.getElementById('items-per-page');

      ['None', 'Name', 'Type'].forEach(function (value) {
        sortBy.add(new Option(value, value.toLowerCase()));
      });

      [10, 20, 50].forEach(function (value) {
        pageSize.add(new Option(value, value));
      });

      sortBy.value = sortCriteria;
      pageSize.value = String(itemsPerPage);

      sortBy.addEventListener('change', function () {
        sortCriteria = this.value;
        applyFiltersAndRender();
      });

      document.getElementById('sort-order-btn').addEventListener('click', function () {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        this.textContent = sortOrder === 'asc' ? '↑' : '↓';
        applyFiltersAndRender();
      });

      pageSize.addEventListener('change', function () {
        itemsPerPage = parseInt(this.value, 10);
        currentPage = 1;
        renderPage();
      });

      document.getElementById('search-box').addEventListener('input', applyFiltersAndRender);
      document.getElementById('prev-page-btn').addEventListener('click', function () {
        changePage(-1);
      });
      document.getElementById('next-page-btn').addEventListener('click', function () {
        changePage(1);
      });
    }

    function applyFiltersAndRender() {
      var term = document.getElementById('search-box').value.toLowerCase();

      filteredFiles = allFiles.filter(function (file) {
        return file.name.toLowerCase().includes(term);
      });

      sortFiles();
      currentPage = 1;
      renderPage();
    }

    function sortFiles() {
      if (sortCriteria === 'none') {
        if (sortOrder === 'desc') filteredFiles.reverse();
        return;
      }

      filteredFiles.sort(function (a, b) {
        var valueA = sortCriteria === 'type' ? a.type.toLowerCase() : a.name.toLowerCase();
        var valueB = sortCriteria === 'type' ? b.type.toLowerCase() : b.name.toLowerCase();
        var result = valueA.localeCompare(valueB);
        return sortOrder === 'asc' ? result : -result;
      });
    }

    function renderPage() {
      var list = document.getElementById('file-list');
      list.innerHTML = '';

      if (!filteredFiles.length) {
        showListMessage(allFiles.length ? 'No files found.' : 'No games available.');
        renderPagination();
        listIndex = -1;
        updateSelection();
        return;
      }

      var start = (currentPage - 1) * itemsPerPage;
      filteredFiles.slice(start, start + itemsPerPage).forEach(function (file) {
        var item = document.createElement('li');
        item.textContent = file.name;
        item.tabIndex = 0;
        item.addEventListener('click', function () {
          handleFileClick(file.path);
        });
        item.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') handleFileClick(file.path);
        });
        list.appendChild(item);
      });

      renderPagination();
      listIndex = -1;
      updateSelection();
    }

    function showListMessage(message) {
      var list = document.getElementById('file-list');
      list.innerHTML = '';
      var item = document.createElement('li');
      item.textContent = message;
      list.appendChild(item);
    }

    function renderPagination() {
      var totalPages = Math.max(1, Math.ceil(filteredFiles.length / itemsPerPage));
      document.getElementById('page-info').textContent =
        'Page ' + currentPage + ' of ' + totalPages;
      document.getElementById('prev-page-btn').disabled = currentPage <= 1;
      document.getElementById('next-page-btn').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      var totalPages = Math.ceil(filteredFiles.length / itemsPerPage);
      var nextPage = currentPage + direction;

      if (nextPage < 1 || nextPage > totalPages) return;

      currentPage = nextPage;
      if (!isCloudPhone()) {
        currentFocus = 'list';
        listIndex = 0;
      }
      renderPage();
    }

    function handleFileClick(filePath) {
      showExtractionModal('Extracting MIDlet...');
      extractMidletClassName(filePath, function (error, midletName) {
        if (error) {
          showExtractionModal('Error: ' + error.message);
          return;
        }

        document.getElementById('extraction-modal').style.display = 'none';

        // Run the game in the existing main.html player.
        var url = 'main.html?jarlink=' + encodeURIComponent(filePath) +
          '&midlet=' + encodeURIComponent(midletName);
        window.location.href = url;
      });
    }

    function handleKeyDown(event) {
      var keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Backspace'];
      if (keys.includes(event.key)) event.preventDefault();

      if (currentFocus === 'modal') {
        if (event.key === 'Enter' || event.key === 'Backspace') closeExtractionModal();
        return;
      }

      var controlIndex = focusableControls.indexOf(currentFocus);

      switch (event.key) {
        case 'ArrowDown':
          if (currentFocus === 'list') {
            if (listIndex < document.getElementById('file-list').children.length - 1) {
              listIndex++;
            }
          } else if (controlIndex < focusableControls.length - 1) {
            currentFocus = focusableControls[controlIndex + 1];
          } else if (filteredFiles.length) {
            currentFocus = 'list';
            listIndex = 0;
          }
          break;

        case 'ArrowUp':
          if (currentFocus === 'list') {
            if (listIndex > 0) {
              listIndex--;
            } else {
              listIndex = -1;
              currentFocus = focusableControls[focusableControls.length - 1];
            }
          } else if (controlIndex > 0) {
            currentFocus = focusableControls[controlIndex - 1];
          }
          break;

        case 'ArrowRight':
          if (currentFocus === 'list') changePage(1);
          break;

        case 'ArrowLeft':
          if (currentFocus === 'list') changePage(-1);
          break;

        case 'Enter':
          if (currentFocus === 'list' && listIndex >= 0) {
            document.getElementById('file-list').children[listIndex]?.click();
          } else if (currentFocus === 'sort-order-btn') {
            document.getElementById('sort-order-btn').click();
          }
          break;

        case 'Backspace':
          window.close();
          break;
      }

      updateSelection();
    }

    function updateSelection() {
      document.querySelectorAll('.selected').forEach(function (element) {
        element.classList.remove('selected');
      });

      if (isCloudPhone()) return;

      if (currentFocus === 'list') {
        var items = document.getElementById('file-list').children;
        if (items[listIndex]) {
          items[listIndex].classList.add('selected');
          items[listIndex].scrollIntoView({ block: 'nearest' });
        }
      } else {
        var control = document.getElementById(currentFocus);
        if (control) {
          control.classList.add('selected');
          if (currentFocus === 'search-box') control.focus();
        }
      }

      updateSoftkeys();
    }

    function updateSoftkeys() {
      document.getElementById('softkey-left').textContent = '';
      document.getElementById('softkey-right').textContent = 'Exit';

      if (currentFocus === 'modal') {
        document.getElementById('softkey-center').textContent = 'Close';
      } else if (currentFocus === 'list') {
        document.getElementById('softkey-center').textContent = 'Select';
      } else if (currentFocus === 'sort-order-btn') {
        document.getElementById('softkey-center').textContent = 'Toggle';
      } else if (currentFocus.indexOf('select') !== -1) {
        document.getElementById('softkey-center').textContent = 'Change';
      } else {
        document.getElementById('softkey-center').textContent = '';
      }
    }

    function showExtractionModal(message) {
      currentFocus = 'modal';
      document.getElementById('modal-message').textContent = message;
      document.getElementById('extraction-modal').style.display = 'flex';
      if (!isCloudPhone()) updateSoftkeys();
    }

    function closeExtractionModal() {
      document.getElementById('extraction-modal').style.display = 'none';
      currentFocus = 'search-box';
      updateSelection();
    }

    // JAR file is fetched with asynchronous XHR, then parsed by JSZip.
    function extractMidletClassName(jarUrl, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', jarUrl, true);
      xhr.responseType = 'arraybuffer';

      xhr.onload = function () {
        if (xhr.status < 200 || xhr.status >= 300) {
          callback(new Error('Download failed (HTTP ' + xhr.status + ').'));
          return;
        }

        JSZip.loadAsync(xhr.response)
          .then(function (zip) {
            var manifest = zip.file('META-INF/MANIFEST.MF');
            if (!manifest) throw new Error('MANIFEST.MF not found.');
            return manifest.async('string');
          })
          .then(function (content) {
            var line = content.split(/\r?\n/).find(function (entry) {
              return /^MIDlet-\d+:/i.test(entry);
            });

            if (!line) throw new Error('MIDlet entry not found.');

            var parts = line.substring(line.indexOf(':') + 1).split(',');
            if (parts.length < 3) throw new Error('Malformed MIDlet entry.');

            callback(null, parts[parts.length - 1].trim());
          })
          .catch(function (error) {
            callback(error);
          });
      };

      xhr.onerror = function () {
        callback(new Error('Network error while downloading the game.'));
      };

      xhr.send();
    }
  </script>
</body>
</html>
